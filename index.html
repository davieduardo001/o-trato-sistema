<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#252422">
  <title>Trato · Service Desk</title>
  <link rel="preload" href="fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/login.css">
  <link rel="stylesheet" href="styles/app.css">
  <script>
    // aplica tema e tamanho de texto salvos antes da primeira pintura (evita flash)
    try {
      var p = JSON.parse(localStorage.getItem('trato-a11y') || '{}');
      if (['light', 'dark', 'hcb', 'hcw'].indexOf(p.theme) >= 0) document.documentElement.dataset.theme = p.theme;
      var s = [0.875, 1, 1.125, 1.25, 1.375, 1.5][p.scaleIdx];
      if (s) document.documentElement.style.fontSize = (14 * s) + 'px';
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>Este sistema precisa de JavaScript para funcionar.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
